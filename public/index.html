<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFD700">
  <meta name="description" content="Treino personalizado com aulas e progresso acompanhado">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27><rect fill=%27%231A1A1A%27 width=%27192%27 height=%27192%27/><text x=%2796%27 y=%27120%27 font-size=%2780%27 font-weight=%27bold%27 fill=%27%23FFD700%27 text-anchor=%27middle%27 font-family=%27Arial%27>NT</text></svg>">
  <title>Noffs Training</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; }
    .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1A1A1A; }
    .login-box { background: white; padding: 3rem 2rem; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
    .login-box h1 { text-align: center; color: #333; margin-bottom: 0.5rem; font-size: 28px; font-weight: 700; }
    .subtitle { text-align: center; color: #666; margin-bottom: 2rem; font-size: 14px; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: #333; font-weight: 500; }
    .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    .form-group input:focus { outline: none; border-color: #FFD700; box-shadow: 0 0 0 3px rgba(255,215,0,0.1); }
    .btn-login { width: 100%; padding: 0.75rem; background: linear-gradient(135deg, #FFD700 0%, #DAA520 100%); color: #333; border: none; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,215,0,0.3); }
    .message { text-align: center; margin-top: 1rem; padding: 0.75rem; border-radius: 4px; display: none; }
    .message.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .message.error { background: #ffebee; color: #c62828; display: block; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>Noffs Training</h1>
      <p class="subtitle">Faça login para continuar</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">Entrar</button>
        <div class="message" id="message"></div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const messageDiv = document.getElementById('message');
      
      try {
        const response = await fetch('https://daniel-noffs-vercel-production.up.railway.app/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          localStorage.setItem('token', data.token);
          messageDiv.textContent = 'Login realizado! Redirecionando...';
          messageDiv.className = 'message success';
          setTimeout(() => window.location.href = '/dashboard.html', 1500);
        } else {
          messageDiv.textContent = 'Erro: ' + (data.message || 'Falha no login');
          messageDiv.className = 'message error';
        }
      } catch (erro) {
        messageDiv.textContent = 'Erro de conexão: ' + erro.message;
        messageDiv.className = 'message error';
      }
    });
  </script>
</body>
</html>
