<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFD700">
  <meta name="description" content="Treino personalizado com aulas e progresso acompanhado">
  <link rel="manifest" href="/manifest.json">
  <title>Dashboard - Noffs Training</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; background: #1A1A1A; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #333; }
    .dashboard { background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); max-width: 500px; width: 100%; padding: 3rem 2rem; margin: 1rem; }
    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 0.5rem; }
    .header p { color: #666; font-size: 14px; }
    .user-info { background: #f5f5f5; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; text-align: center; }
    .user-info .name { font-size: 18px; font-weight: 600; margin-bottom: 0.5rem; }
    .user-info .email { font-size: 13px; color: #888; }
    .menu { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
    .menu-item { padding: 1rem; background: linear-gradient(135deg, #FFD700 0%, #DAA520 100%); border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; color: #333; transition: transform 0.2s; }
    .menu-item:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,215,0,0.3); }
    .btn-logout { width: 100%; padding: 0.75rem; background: #d32f2f; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-logout:hover { background: #b71c1c; }
    .footer { text-align: center; font-size: 12px; color: #999; margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <h1>Noffs Training</h1>
      <p>Bem-vindo ao seu treino personalizado</p>
    </div>

    <div class="user-info">
      <div class="name" id="userName">Carregando...</div>
      <div class="email" id="userEmail">carregando...</div>
    </div>

    <div class="menu">
      <button class="menu-item">📚 Minhas Aulas</button>
      <button class="menu-item">📊 Meu Progresso</button>
      <button class="menu-item">👤 Perfil</button>
      <button class="menu-item">⚙️ Configurações</button>
    </div>

    <button class="btn-logout" id="logoutBtn">Sair</button>

    <div class="footer">
      <p>© 2026 Noffs Training. Todos os direitos reservados.</p>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      const token = localStorage.getItem('token');
      
      if (!token) {
        alert('Você precisa estar logado!');
        window.location.href = '/index.html';
        return;
      }

      // Decodificar JWT pra pegar os dados do usuário
      try {
        const parts = token.split('.');
        const decoded = JSON.parse(atob(parts[1]));
        
        document.getElementById('userName').textContent = decoded.name || 'Usuário';
        document.getElementById('userEmail').textContent = decoded.email || 'email@exemplo.com';
      } catch (error) {
        console.error('Erro ao decodificar token:', error);
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = '/index.html';
    });
  </script>
  <script>
    if (navigator.serviceWorker) {
      navigator.serviceWorker.register("/service-worker.js");
    }
  </script>
</body>
</html>
